name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: devopsproductcrci.azurecr.io
  KUBE_NAMESPACE: microservices

jobs:
  # ============ CODE QUALITY & SECURITY ============
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Python setup for Python services
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black safety

    # Node.js setup for Node.js services
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install Node.js dependencies
      run: |
        npm install -g eslint prettier

    # Python linting for Python services
    - name: Lint Python services with flake8
      run: flake8 services/api-gateway services/product-service services/order-service services/payment-service --count --select=E9,F63,F7,F82 --show-source --statistics

    # Node.js linting for Node.js services
    - name: Lint Node.js services with ESLint
      run: |
        cd services/user-service && npm install && npm run lint || true
        cd ../notification-service && npm install && npm run lint || true

    - name: Check Python code formatting
      run: black --check services/api-gateway services/product-service services/order-service services/payment-service

    - name: Check Node.js code formatting
      run: |
        cd services/user-service && npx prettier --check . || true
        cd ../notification-service && npx prettier --check . || true

    - name: Security audit for Python services
      run: safety check --json > safety-report.json || true
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: safety-report.json

  # ============ BUILD & TEST ============
  build-and-test:
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service, payment-service, notification-service]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build ${{ matrix.service }}
      run: |
        cd services/${{ matrix.service }}
        docker build -t ${{ matrix.service }}:test .
    - name: Run tests for ${{ matrix.service }}
      run: |
        cd services/${{ matrix.service }}
        if [ -f requirements.txt ]; then
          # Python service
          pip install -r requirements.txt
          if [ -f tests/test_*.py ]; then
            python -m pytest tests/ -v
          else
            echo "No Python tests found for ${{ matrix.service }}"
          fi
        elif [ -f package.json ]; then
          # Node.js service
          npm install
          if npm test 2>/dev/null; then
            npm test
          else
            echo "No Node.js tests found for ${{ matrix.service }}"
          fi
        else
          echo "No recognized dependency file for ${{ matrix.service }}"
        fi

  # ============ BUILD & PUSH TO ACR ============
  build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service, payment-service, notification-service]
    steps:
    - uses: actions/checkout@v4
    - name: Login to ACR
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v4
      with:
        context: ./services/${{ matrix.service }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Image scan
      run: |
        docker pull ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
        echo "Image scanning completed for ${{ matrix.service }}"

  # ============ DEPLOYMENT ============
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: devops-prod-rg-centralindia
        cluster-name: devops-prod-aks-ci
    
    - name: Create namespace
      run: kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Apply ConfigMaps and Secrets
      run: |
        kubectl apply -f k8s/configmaps/
        kubectl apply -f k8s/secrets/
    
    - name: Update image tags in deployments
      run: |
        for service in api-gateway user-service product-service order-service payment-service notification-service; do
          sed -i "s|${{ env.REGISTRY }}/$service:latest|${{ env.REGISTRY }}/$service:${{ github.sha }}|g" k8s/deployments/$service.yaml
        done
    
    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/namespaces/
        kubectl apply -f k8s/configmaps/
        kubectl apply -f k8s/secrets/
        kubectl apply -f k8s/deployments/
        kubectl apply -f k8s/services/
        kubectl apply -f k8s/ingress/
        kubectl apply -f k8s/hpa/
        kubectl apply -f k8s/policies/
        kubectl apply -f k8s/monitoring/
        kubectl apply -f k8s/rbac/
    
    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/api-gateway -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
        kubectl rollout status deployment/user-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
        kubectl rollout status deployment/order-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
        kubectl rollout status deployment/payment-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
    
    - name: Health checks
      run: |
        kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
        kubectl get svc -n ${{ env.KUBE_NAMESPACE }}
        kubectl get hpa -n ${{ env.KUBE_NAMESPACE }}
    
    - name: Smoke tests
      run: |
        API_GATEWAY_IP=$(kubectl get svc api-gateway -n ${{ env.KUBE_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "API Gateway IP: $API_GATEWAY_IP"
        curl -i http://$API_GATEWAY_IP/health || echo "Health check failed"
  
  # ============ ROLLBACK ON FAILURE ============
  rollback:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: devops-prod-rg-centralindia
        cluster-name: devops-prod-aks-ci
    
    - name: Rollback deployments
      run: |
        for service in api-gateway user-service product-service order-service payment-service notification-service; do
          kubectl rollout undo deployment/$service -n ${{ env.KUBE_NAMESPACE }}
        done
    
    - name: Verify rollback
      run: kubectl get pods -n ${{ env.KUBE_NAMESPACE }}